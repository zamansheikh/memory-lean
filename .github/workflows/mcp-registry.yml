name: publish to MCP registry

# Called by the publish workflow once the version is on npm, or run by hand after
# `npm publish`: the registry checks that the npm package of the same version exists
# and carries the matching mcpName.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # The publisher is pinned to one release and checked against that release's SHA-256
      # (the "digest" of the asset on its GitHub release page), so a later release cannot
      # change what runs here. To update: change both values together.
      MCP_PUBLISHER_VERSION: v1.8.9
      MCP_PUBLISHER_SHA256: 4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8
    steps:
      - uses: actions/checkout@v4
      - name: Wait for npm to serve this version
        run: |
          version=$(node -p "require('./package.json').version")
          # npm can take several minutes to serve a version published with trusted publishing
          for i in $(seq 1 60); do npm view "memory-lean@$version" version 2>/dev/null && exit 0; sleep 10; done
          echo "memory-lean@$version is not on npm; run npm publish first, or run this workflow again later"
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
