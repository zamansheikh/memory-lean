name: publish

# Pushing a tag like v1.5.0 publishes that version to npm and then to the MCP registry.
# npm trusts this workflow through OIDC (npmjs.com > memory-lean > Settings > Trusted
# Publisher), so no token or one-time password is involved.
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm test
      - name: Publish to npm
        run: |
          npm install -g npm@latest
          npm publish

  # Its own job, on its own machine: the downloaded publisher never runs beside the npm publish.
  registry:
    needs: npm
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/mcp-registry.yml
